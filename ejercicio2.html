<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de productos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="page-shell">
        <section class="card">
            <p class="eyebrow">Ejercicio 2</p>
            <h1>Inventario de productos</h1>
            <form id="formulario">
                <label for="producto">Nombre del producto:</label>
                <input type="text" id="producto" required>
                <label for="precio">Precio unitario:</label>
                <input type="number" id="precio" min="0.01" step="0.01" required>
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" min="1" step="1" required>
                <button type="button" onclick="agregarProducto()">Agregar producto</button>
            </form>
            <h2>Productos registrados</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
            <h2>Resultados</h2>
            <p id="total"></p>
            <a class="back-link" href="index.html">Volver a los ejercicios</a>
        </section>
    </main>
    <script src="js/ejercicio2.js"></script>
</body>
</html>
