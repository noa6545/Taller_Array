<!DOCTYPE html>
<html lang="es">
<head>

    <title>Registro de nombres</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="page-shell">
        <section class="card">
            <p class="eyebrow">Ejercicio 1</p>
            <h1>Registro de nombres</h1>

            <h2>Personas registradas</h2>
            <ul id="lista"></ul>
            <p id="cantidad"></p>
            <a class="back-link" href="index.html">Volver a los ejercicios</a>
        </section>
    </main>
